<!DOCTYPE html>
<html lang="es" class="h-full bg-[#070709] text-gray-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Book Tracker Pro By: YasmaStak</title>
  
  <!-- Neon Red Book Favicon via Data URI SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23070709'/><rect x='2' y='2' width='96' height='96' rx='20' fill='none' stroke='%23ff0033' stroke-width='4' opacity='0.8'/><path d='M25 30 C 35 25, 45 28, 50 32 C 55 28, 65 25, 75 30 L 75 75 C 65 70, 55 73, 50 77 C 45 73, 35 70, 25 75 Z' fill='%23ff0033' opacity='0.25' stroke='%23ff0033' stroke-width='5' stroke-linejoin='round'/><path d='M50 32 L 50 77' stroke='%23ff0033' stroke-width='5' stroke-linecap='round'/><circle cx='50' cy='32' r='4' fill='%23ff2a55'/></svg>" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            neon: {
              red: '#ff0033',
              crimson: '#ff2a55',
              glow: '#ff003380',
              dark: '#0a0a0d',
              card: '#121218',
              cardHover: '#1a1a24',
              glass: 'rgba(18, 18, 24, 0.85)',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'neon-sm': '0 0 10px rgba(255, 0, 51, 0.3)',
            'neon-md': '0 0 20px rgba(255, 0, 51, 0.45)',
            'neon-lg': '0 0 35px rgba(255, 0, 51, 0.6)',
            'glass': '0 12px 40px 0 rgba(0, 0, 0, 0.6)',
          },
          animation: {
            'fade-in': 'fadeIn 0.25s ease-out forwards',
            'pulse-glow': 'pulseGlow 2.5s infinite ease-in-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'scale(0.96)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
            pulseGlow: {
              '0%, 100%': { boxShadow: '0 0 15px rgba(255, 0, 51, 0.3)' },
              '50%': { boxShadow: '0 0 30px rgba(255, 0, 51, 0.7)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS Safe area utility */
    body {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a0d;
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a35;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff0033;
    }

    .glass-panel {
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .glass-card {
      background: rgba(22, 22, 30, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 0, 51, 0.15);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      border-color: rgba(255, 0, 51, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 0, 51, 0.25);
    }

    .neon-text-glow {
      text-shadow: 0 0 12px rgba(255, 0, 51, 0.7);
    }

    .ios-btn-tap {
      touch-action: manipulation;
      transition: transform 0.12s ease, filter 0.12s ease;
    }
    .ios-btn-tap:active {
      transform: scale(0.94);
      filter: brightness(0.9);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .modal-centered-container {
      transition: opacity 0.25s ease-out, transform 0.25s ease-out;
    }

    /* Prevent mobile input zoom */
    @media (max-width: 640px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body class="h-full flex flex-col antialiased selection:bg-neon-red selection:text-white bg-[#070709] text-gray-200 overflow-x-hidden">

  <header class="sticky top-0 z-40 w-full glass-panel border-b border-white/10 px-3 sm:px-6 py-2.5 transition-all">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2.5 sm:gap-4">
      
      <!-- Logo & Profile Row for Mobile -->
      <div class="w-full sm:w-auto flex items-center justify-between gap-3">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="app.navigateTo('dashboard')">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-gradient-to-br from-neon-red to-red-900 flex items-center justify-center shadow-neon-sm animate-pulse-glow flex-shrink-0">
            <i class="ph-bold ph-book-open text-lg sm:text-xl text-white"></i>
          </div>
          <div class="min-w-0">
            <h1 class="font-bold text-base sm:text-lg tracking-wide text-white flex items-center gap-1.5 leading-tight">
              BOOK TRACKER<span class="text-neon-red neon-text-glow">PRO</span>
              <span class="text-[9px] sm:text-[10px] uppercase tracking-wider bg-neon-red/20 text-neon-crimson px-1.5 py-0.5 rounded-full border border-neon-red/30 font-semibold truncate">By: YasmaStak</span>
            </h1>
            <p class="text-[10px] text-gray-400 -mt-0.5 hidden xs:block sm:block">Plataforma de Lectura & Estudio Profundo</p>
          </div>
        </div>

        <div class="flex items-center gap-2 sm:hidden">
          <button onclick="app.openBookModal()" class="w-8 h-8 rounded-full bg-neon-red flex items-center justify-center text-white shadow-neon-sm ios-btn-tap">
            <i class="ph-bold ph-plus text-base"></i>
          </button>
          <button onclick="app.openModal('profileModal')" class="w-8 h-8 rounded-full bg-gradient-to-tr from-gray-800 to-gray-700 border border-neon-red/40 flex items-center justify-center text-white ios-btn-tap overflow-hidden">
            <span id="userAvatarTextMobile" class="font-bold text-[11px] text-neon-crimson">US</span>
          </button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="w-full sm:flex-1 sm:max-w-md">
        <div class="relative w-full">
          <i class="ph-bold ph-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input 
            type="text" 
            id="searchInput"
            oninput="app.handleSearch(this.value)"
            placeholder="Buscar libro, autor o género..." 
            class="w-full bg-black/50 border border-white/10 rounded-full pl-9 pr-8 py-1.5 text-xs sm:text-sm text-white placeholder-gray-500 focus:outline-none focus:border-neon-red focus:ring-1 focus:ring-neon-red transition-all"
          />
          <button id="clearSearchBtn" onclick="app.clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
            <i class="ph-bold ph-x-circle text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Desktop Header Quick Actions -->
      <div class="hidden sm:flex items-center gap-2">
        <button onclick="app.openModal('genreModal')" class="flex items-center gap-1.5 bg-neon-red/10 border border-neon-red/30 hover:bg-neon-red/20 text-neon-crimson px-3 py-1.5 rounded-full text-xs font-medium transition-all ios-btn-tap">
          <i class="ph-bold ph-folder-plus text-sm"></i>
          <span>Género</span>
        </button>
        <button onclick="app.openModal('authorModal')" class="flex items-center gap-1.5 bg-neon-red/10 border border-neon-red/30 hover:bg-neon-red/20 text-neon-crimson px-3 py-1.5 rounded-full text-xs font-medium transition-all ios-btn-tap">
          <i class="ph-bold ph-user-plus text-sm"></i>
          <span>Autor</span>
        </button>
        <button onclick="app.openBookModal()" class="flex items-center gap-1.5 bg-neon-red hover:bg-red-600 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold shadow-neon-sm transition-all ios-btn-tap">
          <i class="ph-bold ph-plus text-sm"></i>
          <span>Nuevo Libro</span>
        </button>
        
        <button onclick="app.openModal('profileModal')" class="w-9 h-9 rounded-full bg-gradient-to-tr from-gray-800 to-gray-700 border border-neon-red/40 flex items-center justify-center text-white ml-1 hover:border-neon-red transition-all ios-btn-tap overflow-hidden">
          <span id="userAvatarText" class="font-bold text-xs text-neon-crimson">US</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 lg:p-8 flex flex-col gap-4 sm:gap-6 pb-20 sm:pb-8">
    <div id="breadcrumb" class="flex items-center gap-1.5 text-[11px] sm:text-xs text-gray-400 overflow-x-auto pb-1 hide-scrollbar">
    </div>

    <div id="viewContainer" class="flex-1 flex flex-col">
    </div>
  </main>

  <!-- Mobile Bottom Navigation Bar -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-white/10 px-4 py-2 flex items-center justify-around bg-[#08080c]/90">
    <button onclick="app.navigateTo('dashboard')" class="flex flex-col items-center gap-0.5 text-neon-red ios-btn-tap min-w-[50px] py-1">
      <i class="ph-bold ph-house text-lg"></i>
      <span class="text-[10px] font-medium">Inicio</span>
    </button>
    <button onclick="app.openModal('genreModal')" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white ios-btn-tap min-w-[50px] py-1">
      <i class="ph-bold ph-folder-plus text-lg"></i>
      <span class="text-[10px] font-medium">Géneros</span>
    </button>
    <button onclick="app.openBookModal()" class="flex flex-col items-center gap-0.5 text-neon-crimson ios-btn-tap min-w-[50px] py-1">
      <i class="ph-bold ph-plus-circle text-xl"></i>
      <span class="text-[10px] font-semibold">Añadir</span>
    </button>
    <button onclick="app.openModal('profileModal')" class="flex flex-col items-center gap-0.5 text-gray-400 hover:text-white ios-btn-tap min-w-[50px] py-1">
      <i class="ph-bold ph-user text-lg"></i>
      <span class="text-[10px] font-medium">Perfil</span>
    </button>
  </nav>

  <div id="modalBackdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden transition-opacity duration-300 opacity-0" onclick="app.closeAllModals()"></div>

  <!-- 1. GENRE MODAL -->
  <div id="genreModal" class="modal-centered-container fixed inset-0 z-50 hidden flex items-center justify-center p-3 sm:p-4 pointer-events-none opacity-0 scale-95">
    <div class="glass-panel border border-neon-red/30 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl bg-[#0e0e14] w-[95vw] sm:w-full sm:max-w-md max-h-[88vh] flex flex-col pointer-events-auto">
      <div class="flex items-center justify-between pb-3 border-b border-white/10 flex-shrink-0">
        <h3 id="genreModalTitle" class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-folder-plus text-neon-red"></i> Nuevo Género
        </h3>
        <button onclick="app.closeModal('genreModal')" class="text-gray-400 hover:text-white p-1 ios-btn-tap"><i class="ph-bold ph-x text-lg"></i></button>
      </div>

      <form id="genreForm" onsubmit="app.saveGenre(event)" class="space-y-3.5 sm:space-y-4 pt-3 sm:pt-4 overflow-y-auto pr-1">
        <input type="hidden" id="genreId" />
        <div>
          <label class="block text-xs text-gray-400 font-medium mb-1">Nombre del Género</label>
          <input type="text" id="genreName" required placeholder="Ej: Desarrollo Personal..." class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 font-medium mb-1">Color / Icono Decorativo</label>
          <div class="flex gap-2">
            <input type="color" id="genreColor" value="#ff0033" class="h-10 w-12 rounded-xl bg-transparent border border-white/10 cursor-pointer p-1 flex-shrink-0" />
            <input type="text" id="genreIcon" placeholder="Ej: ph-brain, ph-rocket" value="ph-books" class="flex-1 min-w-0 bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
          </div>
          <p class="text-[10px] text-gray-500 mt-1">Usa iconos de Phosphor (ej: ph-lightbulb, ph-code)</p>
        </div>
        <div class="pt-3 border-t border-white/10 flex flex-col-reverse sm:flex-row justify-end gap-2 sm:gap-3 flex-shrink-0">
          <button type="button" onclick="app.closeModal('genreModal')" class="w-full sm:w-auto px-4 py-2 rounded-xl text-xs text-gray-400 hover:bg-white/5">Cancelar</button>
          <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-semibold bg-neon-red text-white hover:bg-red-600 shadow-neon-sm ios-btn-tap">Guardar Género</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. AUTHOR MODAL -->
  <div id="authorModal" class="modal-centered-container fixed inset-0 z-50 hidden flex items-center justify-center p-3 sm:p-4 pointer-events-none opacity-0 scale-95">
    <div class="glass-panel border border-neon-red/30 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl bg-[#0e0e14] w-[95vw] sm:w-full sm:max-w-md max-h-[88vh] flex flex-col pointer-events-auto">
      <div class="flex items-center justify-between pb-3 border-b border-white/10 flex-shrink-0">
        <h3 id="authorModalTitle" class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-user-plus text-neon-red"></i> Nuevo Autor
        </h3>
        <button onclick="app.closeModal('authorModal')" class="text-gray-400 hover:text-white p-1 ios-btn-tap"><i class="ph-bold ph-x text-lg"></i></button>
      </div>

      <form id="authorForm" onsubmit="app.saveAuthor(event)" class="space-y-3.5 sm:space-y-4 pt-3 sm:pt-4 overflow-y-auto pr-1">
        <input type="hidden" id="authorId" />
        <div>
          <label class="block text-xs text-gray-400 font-medium mb-1">Nombre Completo del Autor</label>
          <input type="text" id="authorName" required placeholder="Ej: James Clear..." class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 font-medium mb-1">Género Asignado</label>
          <div class="relative">
            <input type="text" id="authorGenreInput" list="existingGenresList" required placeholder="Escribe o selecciona género..." class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
            <datalist id="existingGenresList">
            </datalist>
          </div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 font-medium mb-1">Biografía Breve</label>
          <textarea id="authorBio" rows="2" placeholder="Información destacada del autor..." class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none"></textarea>
        </div>
        <div class="pt-3 border-t border-white/10 flex flex-col-reverse sm:flex-row justify-end gap-2 sm:gap-3 flex-shrink-0">
          <button type="button" onclick="app.closeModal('authorModal')" class="w-full sm:w-auto px-4 py-2 rounded-xl text-xs text-gray-400 hover:bg-white/5">Cancelar</button>
          <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-semibold bg-neon-red text-white hover:bg-red-600 shadow-neon-sm ios-btn-tap">Guardar Autor</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. BOOK MODAL -->
  <div id="bookModal" class="modal-centered-container fixed inset-0 z-50 hidden flex items-center justify-center p-3 sm:p-4 pointer-events-none opacity-0 scale-95">
    <div class="glass-panel border border-neon-red/30 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl bg-[#0e0e14] w-[95vw] sm:w-full sm:max-w-lg max-h-[88vh] flex flex-col pointer-events-auto">
      <div class="flex items-center justify-between pb-3 border-b border-white/10 flex-shrink-0">
        <h3 id="bookModalTitle" class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-book-bookmark text-neon-red"></i> Agregar Nuevo Libro
        </h3>
        <button onclick="app.closeModal('bookModal')" class="text-gray-400 hover:text-white p-1 ios-btn-tap"><i class="ph-bold ph-x text-lg"></i></button>
      </div>

      <form id="bookForm" onsubmit="app.saveBook(event)" class="space-y-3.5 sm:space-y-4 pt-3 sm:pt-4 overflow-y-auto pr-1">
        <input type="hidden" id="bookId" />
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4">
          <div class="sm:col-span-2">
            <label class="block text-xs text-gray-400 font-medium mb-1">Título del Libro *</label>
            <input type="text" id="bookTitle" required placeholder="Ej: Hábitos Atómicos" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 font-medium mb-1">Género *</label>
            <select id="bookGenreId" onchange="app.updateAuthorDropdown(this.value)" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none">
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-400 font-medium mb-1">Autor *</label>
            <select id="bookAuthorId" required class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none">
            </select>
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs text-gray-400 font-medium mb-1">URL de Portada (Image Link)</label>
            <input type="url" id="bookCover" placeholder="https://ejemplo.com/portada.jpg" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
          </div>

          <div>
            <label class="block text-xs text-gray-400 font-medium mb-1">Estado de Lectura</label>
            <select id="bookStatus" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none">
              <option value="Leyendo">📖 Leyendo</option>
              <option value="Por Leer">⏳ Por Leer</option>
              <option value="Completado">✅ Completado</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-gray-400 font-medium mb-1">Página Actual Leída</label>
            <input type="number" id="bookCurrentPage" min="0" value="0" placeholder="0" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
          </div>

          <div class="sm:col-span-2">
            <label class="block text-xs text-neon-crimson font-semibold mb-1">Páginas Totales del Libro *</label>
            <input type="number" id="bookTotalPages" min="1" required value="150" placeholder="150" class="w-full bg-black/50 border border-neon-red/40 rounded-xl px-3 py-2.5 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
          </div>
        </div>

        <div class="pt-3 border-t border-white/10 flex flex-col-reverse sm:flex-row justify-end gap-2 sm:gap-3 flex-shrink-0">
          <button type="button" onclick="app.closeModal('bookModal')" class="w-full sm:w-auto px-4 py-2 rounded-xl text-xs text-gray-400 hover:bg-white/5">Cancelar</button>
          <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl text-xs font-semibold bg-neon-red text-white hover:bg-red-600 shadow-neon-sm ios-btn-tap">Guardar Libro</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 4. NOTE MODAL -->
  <div id="noteModal" class="modal-centered-container fixed inset-0 z-50 hidden flex items-center justify-center p-3 sm:p-4 pointer-events-none opacity-0 scale-95">
    <div class="glass-panel border border-neon-red/30 rounded-2xl sm:rounded-3xl p-4 sm:p-6 shadow-2xl bg-[#0e0e14] w-[95vw] sm:w-full sm:max-w-2xl max-h-[88vh] flex flex-col pointer-events-auto">
      <div class="flex items-center justify-between pb-3 border-b border-white/10 flex-shrink-0">
        <h3 id="noteModalTitle" class="text-base sm:text-lg font-bold text-white flex items-center gap-2">
          <i class="ph-bold ph-notebook text-neon-red"></i> Nueva Nota por Capítulo
        </h3>
        <button onclick="app.closeModal('noteModal')" class="text-gray-400 hover:text-white p-1 ios-btn-tap"><i class="ph-bold ph-x text-lg"></i></button>
      </div>

      <form id="noteForm" onsubmit="app.saveNote(event)" class="space-y-3.5 sm:space-y-4 pt-3 sm:pt-4 overflow-y-auto pr-1">
        <input type="hidden" id="noteId" />
        <input type="hidden" id="noteBookId" />

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4">
          <div class="sm:col-span-1">
            <label class="block text-xs text-gray-400 font-medium mb-1">Capítulo / Sección *</label>
            <input type="text" id="noteChapter" required placeholder="Ej: Cap. 1" class="w-full bg-black/50 border border-white/10 rounded-xl px-3 py-2 text-xs sm:text-sm text-white focus:border-neon-red focus:outline-none" />
          </div>
          <div class="sm:col-span-2">
            <label class="block text-xs text-gray-400 font-medium mb-1">Título de la Nota *</label>

  <div id="toast" class="fixed top-3 right-3 left-3 sm:left-auto z-50 transform -translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">

      <div id="toastIcon" class="w-6 h-6 rounded-full bg-neon-red/20 text-neon-red flex items-center justify-center flex-shrink-0">
        <i class="ph-bold ph-check text-xs"></i>
      </div>
      <p id="toastMessage" class="text-xs font-medium text-white truncate">Notificación</p>
    </div>
  </div>

  <script>
    /* 
      Book Tracker Pro By: YasmaStak
      Fully Mobile Responsive & Page Progress Tracking
    */

    const SAMPLE_PROFILE_DATA = {
      user: { name: 'Estudiante Alfa' },
      genres: [
        { id: 'g1', name: 'Desarrollo Personal', color: '#ff0033', icon: 'ph-brain' },
        { id: 'g2', name: 'Filosofía & Estoicismo', color: '#e63946', icon: 'ph-scroll' },
        { id: 'g3', name: 'Negocios & Estrategia', color: '#3a86ff', icon: 'ph-chart-line-up' }
      ],
      authors: [
        { id: 'a1', genreId: 'g1', name: 'James Clear', bio: 'Especialista en creación de hábitos y mejora continua.' },
        { id: 'a2', genreId: 'g2', name: 'Marco Aurelio', bio: 'Emperador romano y filósofo estoico.' },
        { id: 'a3', genreId: 'g3', name: 'Alex Hormozi', bio: 'Empresario e inversionista.' }
      ],
      books: [
        {
          id: 'b1',
          genreId: 'g1',
          authorId: 'a1',
          title: 'Hábitos Atómicos',
          cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80',
          status: 'Leyendo',
          currentPage: 98,
          totalPages: 150
        },
        {
          id: 'b2',
          genreId: 'g2',
          authorId: 'a2',
          title: 'Meditaciones',
          cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=600&q=80',
          status: 'Completado',
          currentPage: 220,
          totalPages: 220
        }
      ],
      notes: [
        {
          id: 'n1',
          bookId: 'b1',
          chapter: 'Capítulo 1',
          title: 'El sorprendente poder de los hábitos atómicos',
          summary: 'La regla del 1%: Mejorar un 1% cada día produce un resultado compuesto gigantesco.',
          teachings: 'Los resultados son una medida diferida de tus hábitos.',
          application: 'Diseñar un checklist de 3 acciones mínimas para mi mañana.',
          createdAt: new Date().toISOString()
        }
      ]
    };

    class BookTrackerApp {
      constructor() {
        this.profilesIndex = this.loadProfilesIndex();
        this.activeProfileId = this.loadActiveProfileId();
        this.data = this.loadProfileData(this.activeProfileId);

        this.currentView = 'dashboard';
        this.viewParams = {};
        this.searchQuery = '';

        this.init();
      }

      init() {
        this.renderView();
        this.updateProfileUI();
      }

      loadProfilesIndex() {
        const stored = localStorage.getItem('BOOK_TRACKER_PRO_PROFILES');
        if (stored) {
          try { return JSON.parse(stored); } catch (e) { console.error(e); }
        }
        const initialProfiles = [{ id: 'profile_default', name: 'Estudiante Alfa' }];
        localStorage.setItem('BOOK_TRACKER_PRO_PROFILES', JSON.stringify(initialProfiles));
        return initialProfiles;
      }

      saveProfilesIndex() {
        localStorage.setItem('BOOK_TRACKER_PRO_PROFILES', JSON.stringify(this.profilesIndex));
      }

      loadActiveProfileId() {
        const stored = localStorage.getItem('BOOK_TRACKER_PRO_ACTIVE_ID');
        if (stored && this.profilesIndex.some(p => p.id === stored)) {
          return stored;
        }
        return this.profilesIndex[0]?.id || 'profile_default';
      }

      setActiveProfileId(profileId) {
        this.activeProfileId = profileId;
        localStorage.setItem('BOOK_TRACKER_PRO_ACTIVE_ID', profileId);
        this.data = this.loadProfileData(profileId);
        this.renderView();
        this.updateProfileUI();
        this.showToast('Perfil: ' + this.data.user.name);
      }

      loadProfileData(profileId) {
        const key = 'BOOK_TRACKER_DATA_' + profileId;
        const stored = localStorage.getItem(key);
        if (stored) {
          try { return JSON.parse(stored); } catch (e) { console.error(e); }
        }

        const freshData = JSON.parse(JSON.stringify(SAMPLE_PROFILE_DATA));
        const matchedIndex = this.profilesIndex.find(p => p.id === profileId);
        if (matchedIndex) freshData.user.name = matchedIndex.name;

        this.saveProfileData(profileId, freshData);
        return freshData;
      }

      saveProfileData(profileId = this.activeProfileId, dataToSave = this.data) {
        const key = 'BOOK_TRACKER_DATA_' + profileId;
        localStorage.setItem(key, JSON.stringify(dataToSave));
      }

      saveData() {
        this.saveProfileData(this.activeProfileId, this.data);
      }

      createNewProfilePrompt() {
        const name = prompt('Ingresa el nombre para el nuevo perfil:');
        if (!name || !name.trim()) return;

        const cleanName = name.trim();
        const newProfileId = 'profile_' + Date.now();
        
        this.profilesIndex.push({ id: newProfileId, name: cleanName });
        this.saveProfilesIndex();

        const newProfileData = {
          user: { name: cleanName },
          genres: [],
          authors: [],
          books: [],
          notes: []
        };
        this.saveProfileData(newProfileId, newProfileData);

        this.setActiveProfileId(newProfileId);
      }

      deleteCurrentProfile() {
        if (this.profilesIndex.length <= 1) {
          alert('Debes mantener al menos un perfil activo.');
          return;
        }

        if (confirm(`¿Estás seguro de eliminar el perfil "${this.data.user.name}"?`)) {
          const idToRemove = this.activeProfileId;
          localStorage.removeItem('BOOK_TRACKER_DATA_' + idToRemove);

          this.profilesIndex = this.profilesIndex.filter(p => p.id !== idToRemove);
          this.saveProfilesIndex();

          this.setActiveProfileId(this.profilesIndex[0].id);
        }
      }

      saveUserProfileName() {
        const nameInput = document.getElementById('userNameInput');
        if (!nameInput) return;

        const newName = nameInput.value.trim();
        if (!newName) return;

        this.data.user.name = newName;
        this.saveData();

        const pIdx = this.profilesIndex.find(p => p.id === this.activeProfileId);
        if (pIdx) {
          pIdx.name = newName;
          this.saveProfilesIndex();
        }

        this.updateProfileUI();
        this.renderView();
        this.showToast('Nombre actualizado');
      }

      renderProfilesList() {
        const container = document.getElementById('profilesList');
        if (!container) return;

        container.innerHTML = this.profilesIndex.map(p => {
          const isActive = p.id === this.activeProfileId;
          return `
            <div onclick="app.setActiveProfileId('${p.id}')" class="p-2.5 rounded-xl cursor-pointer flex items-center justify-between transition-all ${
              isActive 
                ? 'bg-neon-red/20 border border-neon-red/50 text-white shadow-neon-sm' 
                : 'bg-white/5 border border-white/10 hover:bg-white/10 text-gray-300'
            }">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-7 h-7 rounded-full ${isActive ? 'bg-neon-red text-white' : 'bg-gray-800 text-gray-400'} flex items-center justify-center font-bold text-xs flex-shrink-0">
                  ${p.name.charAt(0).toUpperCase()}
                </div>
                <span class="text-xs font-medium truncate">${this.escapeHTML(p.name)}</span>
              </div>
              ${isActive ? '<span class="text-[9px] bg-neon-red text-white font-bold px-2 py-0.5 rounded-full flex-shrink-0">Activo</span>' : ''}
            </div>
          `;
        }).join('');
      }

      exportProfileData() {
        const jsonStr = JSON.stringify(this.data, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BookTrackerPro_${this.data.user.name.replace(/\s+/g, '_')}_Backup.json`;
        a.click();
        URL.revokeObjectURL(url);
        this.showToast('Respaldo descargado');
      }

      importProfileData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported && imported.user && Array.isArray(imported.books)) {
              this.data = imported;
              this.saveData();
              this.renderView();
              this.updateProfileUI();
              this.showToast('Datos importados');
            } else {
              alert('Formato JSON no válido.');
            }
          } catch (err) {
            alert('Error al leer el archivo.');
          }
        };
        reader.readAsText(file);
      }

      resetSampleData() {
        this.data = JSON.parse(JSON.stringify(SAMPLE_PROFILE_DATA));
        this.saveData();
        this.renderView();
        this.closeModal('profileModal');
        this.showToast('Datos demo restaurados');
      }

      calcBookProgress(currentPage, totalPages) {
        const current = Math.max(0, parseInt(currentPage) || 0);
        const total = Math.max(1, parseInt(totalPages) || 150);
        const pct = Math.min(100, Math.round((current / total) * 100));
        return { current, total, pct };
      }

      updateQuickPageProgress(bookId, newPage) {
        const book = this.data.books.find(b => b.id === bookId);
        if (!book) return;

        const total = book.totalPages || 150;
        const pageVal = Math.min(total, Math.max(0, parseInt(newPage) || 0));

        book.currentPage = pageVal;
        if (pageVal >= total) {
          book.status = 'Completado';
        } else if (pageVal > 0 && book.status === 'Por Leer') {
          book.status = 'Leyendo';
        }

        this.saveData();
        this.renderView();
        this.showToast(`Lectura: ${pageVal} / ${total} págs`);
      }

      navigateTo(view, params = {}) {
        this.currentView = view;
        this.viewParams = params;
        this.renderView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      renderBreadcrumb() {
        const breadcrumbEl = document.getElementById('breadcrumb');
        let html = `
          <button onclick="app.navigateTo('dashboard')" class="hover:text-neon-red flex items-center gap-1 transition-colors flex-shrink-0">
            <i class="ph-bold ph-house"></i> Inicio
          </button>
        `;

        if (this.currentView === 'genre' && this.viewParams.genreId) {
          const genre = this.data.genres.find(g => g.id === this.viewParams.genreId);
          if (genre) {
            html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
            html += `<span class="text-white font-medium flex items-center gap-1 flex-shrink-0"><i class="ph-bold ${genre.icon}"></i> ${this.escapeHTML(genre.name)}</span>`;
          }
        } else if (this.currentView === 'author' && this.viewParams.authorId) {
          const author = this.data.authors.find(a => a.id === this.viewParams.authorId);
          const genre = author ? this.data.genres.find(g => g.id === author.genreId) : null;
          if (genre) {
            html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
            html += `<button onclick="app.navigateTo('genre', {genreId: '${genre.id}'})" class="hover:text-neon-red flex-shrink-0">${this.escapeHTML(genre.name)}</button>`;
          }
          if (author) {
            html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
            html += `<span class="text-white font-medium flex-shrink-0">${this.escapeHTML(author.name)}</span>`;
          }
        } else if (this.currentView === 'bookDetail' && this.viewParams.bookId) {
          const book = this.data.books.find(b => b.id === this.viewParams.bookId);
          const author = book ? this.data.authors.find(a => a.id === book.authorId) : null;
          const genre = book ? this.data.genres.find(g => g.id === book.genreId) : null;

          if (genre) {
            html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
            html += `<button onclick="app.navigateTo('genre', {genreId: '${genre.id}'})" class="hover:text-neon-red flex-shrink-0">${this.escapeHTML(genre.name)}</button>`;
          }
          if (author) {
            html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
            html += `<button onclick="app.navigateTo('author', {authorId: '${author.id}'})" class="hover:text-neon-red flex-shrink-0">${this.escapeHTML(author.name)}</button>`;
          }
          if (book) {
            html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
            html += `<span class="text-neon-crimson font-medium truncate max-w-[120px] inline-block align-bottom flex-shrink-0">${this.escapeHTML(book.title)}</span>`;
          }
        } else if (this.currentView === 'search') {
          html += ` <i class="ph-bold ph-caret-right text-[9px] text-gray-600 flex-shrink-0"></i> `;
          html += `<span class="text-white font-medium flex-shrink-0">Búsqueda: "${this.escapeHTML(this.searchQuery)}"</span>`;
        }

        breadcrumbEl.innerHTML = html;
      }

      renderView() {
        this.renderBreadcrumb();
        const container = document.getElementById('viewContainer');
        
        switch (this.currentView) {
          case 'dashboard':
            container.innerHTML = this.renderDashboardHTML();
            break;
          case 'genre':
            container.innerHTML = this.renderGenreViewHTML();
            break;
          case 'author':
            container.innerHTML = this.renderAuthorViewHTML();
            break;
          case 'bookDetail':
            container.innerHTML = this.renderBookDetailHTML();
            break;
          case 'search':
            container.innerHTML = this.renderSearchViewHTML();
            break;
          default:
            container.innerHTML = this.renderDashboardHTML();
        }
      }

      renderDashboardHTML() {
        const currentlyReading = this.data.books.filter(b => b.status === 'Leyendo');
        
        return `
          <div class="animate-fade-in space-y-6 sm:space-y-8">
            <div class="glass-card rounded-2xl sm:rounded-3xl p-4 sm:p-8 relative overflow-hidden bg-gradient-to-r from-neon-dark via-[#12121c] to-black border-neon-red/30">
              <div class="absolute right-[-20px] top-[-20px] w-40 sm:w-60 h-40 sm:h-60 bg-neon-red/10 rounded-full blur-3xl pointer-events-none"></div>
              
              <div class="relative z-10 max-w-2xl">
                <span class="inline-flex items-center gap-1.5 bg-neon-red/20 text-neon-crimson text-[10px] sm:text-xs px-2.5 py-0.5 sm:px-3 sm:py-1 rounded-full font-semibold mb-2 sm:mb-3 border border-neon-red/30">
                  <i class="ph-bold ph-lightning"></i> Espacio de Lectura Activa
                </span>
                <h2 class="text-xl sm:text-3xl font-extrabold text-white tracking-tight">
                  Hola, <span class="text-neon-red neon-text-glow">${this.escapeHTML(this.data.user.name)}</span>
                </h2>
                <p class="text-xs sm:text-sm text-gray-300 mt-1.5 sm:mt-2 leading-relaxed">
                  Lleva el registro de tus páginas leídas, organiza géneros y autores, y convierte la lectura en hábitos prácticos.
                </p>

                <div class="flex flex-wrap gap-2 sm:gap-3 mt-4 sm:mt-5">
                  <button onclick="app.openBookModal()" class="bg-neon-red hover:bg-red-600 text-white font-semibold text-xs px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl sm:rounded-2xl shadow-neon-sm flex items-center gap-1.5 sm:gap-2 ios-btn-tap">
                    <i class="ph-bold ph-plus text-sm sm:text-base"></i> Agregar Libro
                  </button>
                  <button onclick="app.openModal('genreModal')" class="bg-white/5 hover:bg-white/10 text-white text-xs px-3.5 py-2 sm:px-4 sm:py-2.5 rounded-xl sm:rounded-2xl border border-white/10 flex items-center gap-1.5 sm:gap-2 ios-btn-tap">
                    <i class="ph-bold ph-folder-plus text-sm sm:text-base text-neon-crimson"></i> Crear Género
                  </button>

            </div>

            <div class="space-y-1">
              <h5 class="text-[11px] sm:text-xs font-bold text-yellow-400 flex items-center gap-1">
                <i class="ph-bold ph-lightbulb"></i> Enseñanzas Principales:
              </h5>
              <p class="text-xs text-gray-300 leading-relaxed pl-4 whitespace-pre-line">${this.escapeHTML(note.teachings)}</p>
            </div>

            <div class="bg-gradient-to-r from-neon-red/15 to-transparent border-l-2 sm:border-l-4 border-neon-red p-2.5 sm:p-3.5 rounded-r-xl">
              <h5 class="text-[11px] sm:text-xs font-extrabold text-neon-red uppercase tracking-wider flex items-center gap-1">
                <i class="ph-bold ph-lightning"></i> Aplicación en mi Vida:
              </h5>
              <p class="text-xs text-white font-medium mt-0.5 leading-relaxed whitespace-pre-line">${this.escapeHTML(note.application)}</p>
            </div>
          </div>
        `;
      }

      renderSearchViewHTML() {
        const query = this.searchQuery.toLowerCase().trim();
        if (!query) return `<p class="text-gray-400">Escribe algo en la barra de búsqueda.</p>`;

        const matchedBooks = this.data.books.filter(b => {
          const author = this.data.authors.find(a => a.id === b.authorId);
          const genre = this.data.genres.find(g => g.id === b.genreId);
          return b.title.toLowerCase().includes(query) || 
                 (author && author.name.toLowerCase().includes(query)) ||
                 (genre && genre.name.toLowerCase().includes(query));
        });

        return `
          <div class="animate-fade-in space-y-4">
            <h2 class="text-base sm:text-lg font-bold text-white">Búsqueda: "<span class="text-neon-red">${this.escapeHTML(this.searchQuery)}</span>"</h2>

            ${matchedBooks.length === 0 ? `
              <div class="glass-panel p-6 rounded-2xl text-center">
                <i class="ph-bold ph-magnifying-glass text-3xl text-gray-600 mb-2"></i>
                <p class="text-xs text-gray-400">No se encontraron libros coincidentes.</p>
              </div>
            ` : `
              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 sm:gap-4">
                ${matchedBooks.map(book => this.renderBookCardHorizontal(book)).join('')}
              </div>
            `}
          </div>
        `;
      }

      handleSearch(query) {
        this.searchQuery = query;
        const clearBtn = document.getElementById('clearSearchBtn');
        if (query) {
          clearBtn.classList.remove('hidden');
          this.navigateTo('search');
        } else {
          clearBtn.classList.add('hidden');
          this.navigateTo('dashboard');
        }
      }

      clearSearch() {
        document.getElementById('searchInput').value = '';
        this.handleSearch('');
      }

      openModal(modalId) {
        if (modalId === 'profileModal') {
          this.renderProfilesList();
          document.getElementById('userNameInput').value = this.data.user.name;
        }

        const backdrop = document.getElementById('modalBackdrop');
        const modal = document.getElementById(modalId);
        
        backdrop.classList.remove('hidden');
        modal.classList.remove('hidden');

        setTimeout(() => {
          backdrop.classList.add('opacity-100');
          modal.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
          modal.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
        }, 10);
      }

      closeModal(modalId) {
        const backdrop = document.getElementById('modalBackdrop');
        const modal = document.getElementById(modalId);

        backdrop.classList.remove('opacity-100');
        modal.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
        modal.classList.add('opacity-0', 'scale-95', 'pointer-events-none');

        setTimeout(() => {
          backdrop.classList.add('hidden');
          modal.classList.add('hidden');
        }, 250);
      }

      closeAllModals() {
        ['genreModal', 'authorModal', 'bookModal', 'noteModal', 'profileModal'].forEach(m => this.closeModal(m));
      }

      saveGenre(e) {
        e.preventDefault();
        const id = document.getElementById('genreId').value;
        const name = document.getElementById('genreName').value.trim();
        const color = document.getElementById('genreColor').value;
        const icon = document.getElementById('genreIcon').value.trim() || 'ph-books';

        if (id) {
          const index = this.data.genres.findIndex(g => g.id === id);
          if (index !== -1) this.data.genres[index] = { ...this.data.genres[index], name, color, icon };
        } else {
          const newGenre = { id: 'g_' + Date.now(), name, color, icon };
          this.data.genres.push(newGenre);
        }

        this.saveData();
        this.renderView();
        this.closeModal('genreModal');
        this.showToast('Género guardado');
        document.getElementById('genreForm').reset();
      }

      editGenre(genreId) {
        const genre = this.data.genres.find(g => g.id === genreId);
        if (!genre) return;

        document.getElementById('genreId').value = genre.id;
        document.getElementById('genreName').value = genre.name;
        document.getElementById('genreColor').value = genre.color || '#ff0033';
        document.getElementById('genreIcon').value = genre.icon || 'ph-books';
        document.getElementById('genreModalTitle').innerHTML = `<i class="ph-bold ph-pencil-simple text-neon-red"></i> Editar Género`;

        this.openModal('genreModal');
      }

      deleteGenre(genreId) {
        if (confirm('¿Eliminar género?')) {
          this.data.genres = this.data.genres.filter(g => g.id !== genreId);
          this.saveData();
          this.renderView();
          this.showToast('Género eliminado');
        }
      }

      openAuthorModalForGenre(genreId = '') {
        const genre = this.data.genres.find(g => g.id === genreId);
        this.populateGenreDatalist();
        document.getElementById('authorForm').reset();
        document.getElementById('authorId').value = '';
        document.getElementById('authorGenreInput').value = genre ? genre.name : '';
        document.getElementById('authorModalTitle').innerHTML = `<i class="ph-bold ph-user-plus text-neon-red"></i> Nuevo Autor`;
        this.openModal('authorModal');
      }

      populateGenreDatalist() {
        const datalist = document.getElementById('existingGenresList');
        if (datalist) {
          datalist.innerHTML = this.data.genres.map(g => 
            `<option value="${this.escapeHTML(g.name)}"></option>`
          ).join('');
        }
      }

      saveAuthor(e) {
        e.preventDefault();
        const id = document.getElementById('authorId').value;
        const name = document.getElementById('authorName').value.trim();
        const genreInputText = document.getElementById('authorGenreInput').value.trim();
        const bio = document.getElementById('authorBio').value.trim();

        if (!genreInputText) {
          alert('Por favor ingresa un género para el autor.');
          return;
        }

        let genre = this.data.genres.find(g => g.name.toLowerCase() === genreInputText.toLowerCase());

        if (!genre) {
          genre = {
            id: 'g_' + Date.now(),
            name: genreInputText,
            color: '#ff0033',
            icon: 'ph-folders'
          };
          this.data.genres.push(genre);
        }

        if (id) {
          const index = this.data.authors.findIndex(a => a.id === id);
          if (index !== -1) {
            const oldGenreId = this.data.authors[index].genreId;
            this.data.authors[index] = { ...this.data.authors[index], name, genreId: genre.id, bio };

            if (oldGenreId !== genre.id) {
              this.data.books.forEach(b => {
                if (b.authorId === id) b.genreId = genre.id;
              });
            }
          }
        } else {
          const newAuthor = { id: 'a_' + Date.now(), genreId: genre.id, name, bio };
          this.data.authors.push(newAuthor);
        }

        this.saveData();
        this.renderView();
        this.closeModal('authorModal');
        this.showToast('Autor guardado');
        document.getElementById('authorForm').reset();
      }

      editAuthor(authorId) {
        const author = this.data.authors.find(a => a.id === authorId);
        if (!author) return;

        const genre = this.data.genres.find(g => g.id === author.genreId);

        this.populateGenreDatalist();
        document.getElementById('authorId').value = author.id;
        document.getElementById('authorName').value = author.name;
        document.getElementById('authorGenreInput').value = genre ? genre.name : '';
        document.getElementById('authorBio').value = author.bio || '';
        document.getElementById('authorModalTitle').innerHTML = `<i class="ph-bold ph-pencil-simple text-neon-red"></i> Editar Autor`;

        this.openModal('authorModal');
      }

      deleteAuthor(authorId) {
        if (confirm('¿Eliminar autor?')) {
          this.data.authors = this.data.authors.filter(a => a.id !== authorId);
          this.saveData();
          this.renderView();
          this.showToast('Autor eliminado');
        }
      }

      openBookModal() {
        this.populateBookDropdowns();
        document.getElementById('bookForm').reset();
        document.getElementById('bookId').value = '';
        document.getElementById('bookCurrentPage').value = 0;
        document.getElementById('bookTotalPages').value = 150;
        document.getElementById('bookModalTitle').innerHTML = `<i class="ph-bold ph-book-bookmark text-neon-red"></i> Agregar Nuevo Libro`;
        this.openModal('bookModal');
      }

      openBookModalForAuthor(authorId) {
        const author = this.data.authors.find(a => a.id === authorId);
        this.openBookModal();
        if (author) {
          document.getElementById('bookGenreId').value = author.genreId;
          this.updateAuthorDropdown(author.genreId, author.id);
        }
      }

      populateBookDropdowns(selectedGenreId = '', selectedAuthorId = '') {
        const genreSelect = document.getElementById('bookGenreId');
        if (this.data.genres.length === 0) {
          genreSelect.innerHTML = `<option value="">Crea primero un género</option>`;
          return;
        }

        genreSelect.innerHTML = this.data.genres.map(g => 
          `<option value="${g.id}" ${g.id === selectedGenreId ? 'selected' : ''}>${this.escapeHTML(g.name)}</option>`
        ).join('');

        const targetGenreId = selectedGenreId || this.data.genres[0]?.id;
        this.updateAuthorDropdown(targetGenreId, selectedAuthorId);
      }

      updateAuthorDropdown(genreId, selectedAuthorId = '') {
        const authorSelect = document.getElementById('bookAuthorId');
        const filteredAuthors = this.data.authors.filter(a => a.genreId === genreId);

        if (filteredAuthors.length === 0) {
          authorSelect.innerHTML = `<option value="">No hay autores en este género</option>`;
          return;
        }

        authorSelect.innerHTML = filteredAuthors.map(a => 
          `<option value="${a.id}" ${a.id === selectedAuthorId ? 'selected' : ''}>${this.escapeHTML(a.name)}</option>`
        ).join('');
      }

      saveBook(e) {
        e.preventDefault();
        const id = document.getElementById('bookId').value;
        const title = document.getElementById('bookTitle').value.trim();
        const genreId = document.getElementById('bookGenreId').value;
        const authorId = document.getElementById('bookAuthorId').value;
        const cover = document.getElementById('bookCover').value.trim();
        const status = document.getElementById('bookStatus').value;
        const currentPage = parseInt(document.getElementById('bookCurrentPage').value) || 0;
        const totalPages = parseInt(document.getElementById('bookTotalPages').value) || 150;

        if (!genreId || !authorId) {
          alert('Por favor selecciona un género y autor válidos.');
          return;
        }

        if (id) {
          const index = this.data.books.findIndex(b => b.id === id);
          if (index !== -1) {
            this.data.books[index] = { 
              ...this.data.books[index], 
              title, genreId, authorId, cover, status, 
              currentPage, totalPages 
            };
          }
        } else {
          const newBook = { 
            id: 'b_' + Date.now(), 
            genreId, authorId, title, cover, status, 
            currentPage, totalPages 
          };
          this.data.books.push(newBook);
        }

        this.saveData();
        this.renderView();
        this.closeModal('bookModal');
        this.showToast('Libro guardado');
      }

      editBook(bookId) {
        const book = this.data.books.find(b => b.id === bookId);
        if (!book) return;

        this.populateBookDropdowns(book.genreId, book.authorId);
        document.getElementById('bookId').value = book.id;
        document.getElementById('bookTitle').value = book.title;
        document.getElementById('bookCover').value = book.cover || '';
        document.getElementById('bookStatus').value = book.status;
        document.getElementById('bookCurrentPage').value = book.currentPage || 0;
        document.getElementById('bookTotalPages').value = book.totalPages || 150;
        document.getElementById('bookModalTitle').innerHTML = `<i class="ph-bold ph-pencil-simple text-neon-red"></i> Editar Libro`;

        this.openModal('bookModal');
      }

      deleteBook(bookId) {
        if (confirm('¿Seguro que deseas eliminar este libro?')) {
          this.data.books = this.data.books.filter(b => b.id !== bookId);
          this.data.notes = this.data.notes.filter(n => n.bookId !== bookId);
          this.saveData();
          this.navigateTo('dashboard');
          this.showToast('Libro eliminado');
        }
      }

      openNoteModal(bookId) {
        document.getElementById('noteForm').reset();
        document.getElementById('noteId').value = '';
        document.getElementById('noteBookId').value = bookId;
        document.getElementById('noteModalTitle').innerHTML = `<i class="ph-bold ph-notebook text-neon-red"></i> Nueva Nota`;
        this.openModal('noteModal');
      }

      saveNote(e) {
        e.preventDefault();
        const id = document.getElementById('noteId').value;
        const bookId = document.getElementById('noteBookId').value;
        const chapter = document.getElementById('noteChapter').value.trim();
        const title = document.getElementById('noteTitle').value.trim();
        const summary = document.getElementById('noteSummary').value.trim();
        const teachings = document.getElementById('noteTeachings').value.trim();
        const application = document.getElementById('noteApplication').value.trim();

        if (id) {
          const index = this.data.notes.findIndex(n => n.id === id);
          if (index !== -1) {
            this.data.notes[index] = { ...this.data.notes[index], chapter, title, summary, teachings, application };
          }
        } else {
          const newNote = {
            id: 'n_' + Date.now(),
            bookId,
            chapter,
            title,
            summary,
            teachings,
            application,
            createdAt: new Date().toISOString()
          };
          this.data.notes.push(newNote);
        }

        this.saveData();
        this.renderView();
        this.closeModal('noteModal');
        this.showToast('Nota de estudio guardada');
      }

      editNote(noteId) {
        const note = this.data.notes.find(n => n.id === noteId);
        if (!note) return;

        document.getElementById('noteId').value = note.id;
        document.getElementById('noteBookId').value = note.bookId;
        document.getElementById('noteChapter').value = note.chapter;
        document.getElementById('noteTitle').value = note.title;
        document.getElementById('noteSummary').value = note.summary;
        document.getElementById('noteTeachings').value = note.teachings;
        document.getElementById('noteApplication').value = note.application;
        document.getElementById('noteModalTitle').innerHTML = `<i class="ph-bold ph-pencil-simple text-neon-red"></i> Editar Nota`;

        this.openModal('noteModal');
      }

      deleteNote(noteId) {
        if (confirm('¿Eliminar esta nota?')) {
          this.data.notes = this.data.notes.filter(n => n.id !== noteId);
          this.saveData();
          this.renderView();
          this.showToast('Nota eliminada');
        }
      }

      updateProfileUI() {
        const initials = (this.data.user.name || '').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase() || 'US';

        const avatarEl = document.getElementById('userAvatarText');
        const avatarElMobile = document.getElementById('userAvatarTextMobile');

        if (avatarEl) avatarEl.innerText = initials;
        if (avatarElMobile) avatarElMobile.innerText = initials;

        const totalBooks = document.getElementById('statTotalBooks');
        const totalNotes = document.getElementById('statTotalNotes');
        const totalCompleted = document.getElementById('statCompleted');

        if (totalBooks) totalBooks.innerText = this.data.books.length;
        if (totalNotes) totalNotes.innerText = this.data.notes.length;
        if (totalCompleted) totalCompleted.innerText = this.data.books.filter(b => b.status === 'Completado').length;
      }

      showToast(message) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMessage');
        toastMsg.innerText = message;

        toast.classList.remove('-translate-y-20', 'opacity-0');
        setTimeout(() => {
          toast.classList.add('-translate-y-20', 'opacity-0');
        }, 2800);
      }

      escapeHTML(str) {
        return (str || '').replace(/[&<>'"]/g, 
          tag => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            "'": '&#39;',
            '"': '&quot;'
          }[tag] || tag)
        );
      }
    }

    let app;
    window.onload = function() {
      app = new BookTrackerApp();
    };
  </script>
</body>
</html>
